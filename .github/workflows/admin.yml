name: Admin

on:
  push:
    branches: [main]
    paths:
      - apps/admin/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/admin.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Verify Admin
    runs-on: ubuntu-latest
    environment: admin
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Build Admin
        run: pnpm install --frozen-lockfile && pnpm --filter @car-rental/admin build
