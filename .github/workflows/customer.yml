name: Customer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Verify Customer
    runs-on: ubuntu-latest
    environment:
      name: customer
      url: https://car-rental-template.up.railway.app
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Build Customer
        run: pnpm install --frozen-lockfile && pnpm --filter @car-rental/customer build
